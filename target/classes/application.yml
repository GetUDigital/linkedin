server:
  port: 8080

spring:
  application:
    name: linkedin-api

  # ── MySQL Configuration ──────────────────────────────────────────────────
  datasource:
    url: jdbc:mysql://localhost:3306/linkedin_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000

  # ── JPA Configuration ────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: update  # Use 'update' for development, 'validate' for production
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    open-in-view: false

  # ── MongoDB Configuration (if using) ─────────────────────────────────────
  data:
     mongodb:
       uri: mongodb://127.0.0.1:27017/local
       auto-index-creation: true



# ── JWT Configuration ───────────────────────────────────────────────────────
app:
  jwt:
    secret: mySecretKey1234567890123456789012345678901234567890
    expiration-ms: 86400000           # 24 hours
    refresh-expiration-ms: 604800000  # 7 days

# ── Swagger / OpenAPI ────────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method


# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    com.linkedin: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

